name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# 添加权限配置
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 独立的 Lint 和 TypeScript 检查
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint & TypeScript
        run: |
          npm run lint
          npx tsc --noEmit

  # Vue 单元测试
  test-vue:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Vue tests
        run: npm run test:vue

  # React 单元测试
  test-react:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run React tests
        run: npm run test:react

  # 构建测试
  build:
    runs-on: ubuntu-latest
    needs: [test-vue, test-react]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build library
        run: npm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        
      - name: Build Storybook
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          npm run build-storybook:vue
          npm run build-storybook:react
          mkdir -p storybook-static/vue
          mkdir -p storybook-static/react
          cp -r storybook-static-vue/* storybook-static/vue/
          cp -r storybook-static-react/* storybook-static/react/

      - name: Build VitePress Docs
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          npm run docs:build
          mkdir -p storybook-static/docs
          cp -r docs/.vitepress/dist/* storybook-static/docs/
        
      - name: Copy root index.html for navigation
        run: |
          cp index.html storybook-static/index.html
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            storybook-static/

  # 部署 Storybook (仅在 main 分支)
  deploy-storybook:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 