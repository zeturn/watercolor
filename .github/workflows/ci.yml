name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# 添加权限配置
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 独立的 Lint 和 TypeScript 检查
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint & TypeScript
        run: |
          npm run lint
          npx tsc --noEmit

  # Vue 单元测试
  test-vue:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Vue tests
        run: npm run test:vue

  # React 单元测试
  test-react:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run React tests
        run: npm run test:react

  # 构建测试
  build:
    runs-on: ubuntu-latest
    needs: [test-vue, test-react]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build library
        run: npm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        
      - name: Build Storybook
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          npm run build-storybook:vue
          npm run build-storybook:react
          mkdir -p storybook-static/vue
          mkdir -p storybook-static/react
          cp -r storybook-static-vue/* storybook-static/vue/
          cp -r storybook-static-react/* storybook-static/react/
        
      - name: Create root index.html for navigation
        run: |
          cat > storybook-static/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>WaterColor UI - 组件库文档</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      color: #333;
                  }
                  
                  .container {
                      background: white;
                      border-radius: 20px;
                      padding: 60px 40px;
                      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
                      text-align: center;
                      max-width: 600px;
                      width: 90%;
                  }
                  
                  .logo {
                      width: 120px;
                      height: 120px;
                      margin: 0 auto 30px;
                      background: linear-gradient(45deg, #667eea, #764ba2);
                      border-radius: 50%;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      color: white;
                      font-size: 48px;
                      font-weight: bold;
                  }
                  
                  h1 {
                      font-size: 3rem;
                      margin-bottom: 20px;
                      color: #2d3748;
                      background: linear-gradient(45deg, #667eea, #764ba2);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      background-clip: text;
                  }
                  
                  .subtitle {
                      font-size: 1.2rem;
                      color: #718096;
                      margin-bottom: 40px;
                      line-height: 1.6;
                  }
                  
                  .nav-buttons {
                      display: flex;
                      gap: 20px;
                      justify-content: center;
                      flex-wrap: wrap;
                  }
                  
                  .nav-button {
                      display: inline-block;
                      padding: 16px 32px;
                      text-decoration: none;
                      border-radius: 12px;
                      font-weight: 600;
                      font-size: 1.1rem;
                      transition: all 0.3s ease;
                      min-width: 180px;
                  }
                  
                  .vue-button {
                      background: linear-gradient(45deg, #4fc08d, #42b883);
                      color: white;
                  }
                  
                  .react-button {
                      background: linear-gradient(45deg, #61dafb, #21a0c4);
                      color: white;
                  }
                  
                  .nav-button:hover {
                      transform: translateY(-3px);
                      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
                  }
                  
                  .features {
                      margin-top: 40px;
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                      gap: 20px;
                      text-align: left;
                  }
                  
                  .feature {
                      padding: 20px;
                      background: #f7fafc;
                      border-radius: 10px;
                      border-left: 4px solid #667eea;
                  }
                  
                  .feature h3 {
                      color: #2d3748;
                      margin-bottom: 8px;
                      font-size: 1rem;
                  }
                  
                  .feature p {
                      color: #718096;
                      font-size: 0.9rem;
                      line-height: 1.4;
                  }
                  
                  @media (max-width: 768px) {
                      .container {
                          padding: 40px 20px;
                      }
                      
                      h1 {
                          font-size: 2.5rem;
                      }
                      
                      .nav-buttons {
                          flex-direction: column;
                          align-items: center;
                      }
                      
                      .features {
                          grid-template-columns: 1fr;
                          text-align: center;
                      }
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="logo">W</div>
                  <h1>WaterColor UI</h1>
                  <p class="subtitle">优雅的水彩风格组件库<br>支持 Vue 3 和 React 双框架</p>
                  
                  <div class="nav-buttons">
                      <a href="./vue/" class="nav-button vue-button">
                          📖 Vue 组件文档
                      </a>
                      <a href="./react/" class="nav-button react-button">
                          📖 React 组件文档
                      </a>
                  </div>
                  
                  <div class="features">
                      <div class="feature">
                          <h3>🎨 水彩风格</h3>
                          <p>独特的水彩美学设计</p>
                      </div>
                      <div class="feature">
                          <h3>🚀 双框架</h3>
                          <p>同时支持 Vue 3 和 React</p>
                      </div>
                      <div class="feature">
                          <h3>📱 响应式</h3>
                          <p>完美适配各种设备</p>
                      </div>
                      <div class="feature">
                          <h3>🛠 TypeScript</h3>
                          <p>完整的类型支持</p>
                      </div>
                  </div>
              </div>
          </body>
          </html>
          EOF
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            storybook-static/

  # 部署 Storybook (仅在 main 分支)
  deploy-storybook:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 