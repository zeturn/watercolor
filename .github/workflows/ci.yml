name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# 添加权限配置
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 独立的 Lint 和 TypeScript 检查
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint & TypeScript
        run: |
          npm run lint
          npx tsc --noEmit

  # Vue 单元测试
  test-vue:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Vue tests
        run: npm run test:vue

  test-core:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Theme v2 core tests
        run: npm run test:core

  # React 单元测试
  test-react:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run React tests
        run: npm run test:react

  # 构建测试
  build:
    runs-on: ubuntu-latest
    needs: [test-core, test-vue, test-react]
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build library
        run: npm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Audit contracts and public types
        run: |
          npm run audit:theme
          npm run audit:composition
          npm run audit:visual
          npm run audit:visual:minimal
          npm run audit:i18n-a11y
          npm run audit:docs-examples
          npm run audit:bundle
          npm run typecheck:theme
          npm run test:package-theme
        
      - name: Build Storybook
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          npm run build-storybook:vue
          npm run build-storybook:react
          mkdir -p storybook-static/vue
          mkdir -p storybook-static/react
          cp -r packages/vue/storybook-static/* storybook-static/vue/
          cp -r packages/react/storybook-static/* storybook-static/react/

      - name: Run Storybook visual matrix
        run: npm run visual:recipes

      - name: Run Storybook accessibility matrix
        run: npm run visual:a11y

      - name: Build VitePress Docs
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          npm run docs:build
          cp -r docs/.vitepress/dist/* storybook-static/
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            dist/
            storybook-static/

  # 部署 Storybook (仅在 main 分支)
  deploy-storybook:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./storybook-static
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 
