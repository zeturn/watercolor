name: Deploy Landing Page

on:
  push:
    branches: [ main ]
    paths:
      - 'landing-page/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            landing-page/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build watercolor-ui package
        run: npm run build

      - name: Install landing-page dependencies (use local build)
        run: |
          cd landing-page
          npm install

      - name: Build landing page
        run: |
          cd landing-page
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing-page/dist
          destination_dir: .
          force_orphan: true 