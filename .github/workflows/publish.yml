name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      otp:
        description: 'NPM 2FA one-time password (optional; only needed if your token requires OTP)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build Core
        run: npm run build -w packages/core

      - name: Publish Core
        run: |
          if [ -n "${NPM_OTP}" ]; then
            npm publish -w packages/core --access public --provenance --otp="${NPM_OTP}"
          else
            npm publish -w packages/core --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_OTP: ${{ inputs.otp }}

  publish-react:
    runs-on: ubuntu-latest
    needs: publish-core
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build Core
        run: npm run build -w packages/core

      - name: Build React
        run: npm run build -w packages/react

      - name: Publish React
        run: |
          if [ -n "${NPM_OTP}" ]; then
            npm publish -w packages/react --access public --provenance --otp="${NPM_OTP}"
          else
            npm publish -w packages/react --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_OTP: ${{ inputs.otp }}

  publish-vue:
    runs-on: ubuntu-latest
    needs: publish-core
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build Core
        run: npm run build -w packages/core

      - name: Build Vue
        run: npm run build -w packages/vue

      - name: Publish Vue
        run: |
          if [ -n "${NPM_OTP}" ]; then
            npm publish -w packages/vue --access public --provenance --otp="${NPM_OTP}"
          else
            npm publish -w packages/vue --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_OTP: ${{ inputs.otp }}
