name: Publish to GitHub Packages and npm

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件：推送版本标签，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-gpr:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zeturn'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure package for GitHub Packages
        run: |
          # 备份原始 package.json
          cp package.json package.json.bak
          
          # 修改 name 字段为带作用域的名称
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@zeturn/watercolor-ui';
            pkg.publishConfig = {
              registry: 'https://npm.pkg.github.com'
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # 如果版本已存在，继续执行后续步骤

      - name: Restore original package.json
        if: always()
        run: mv package.json.bak package.json

  publish-npm:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

  create-release:
    needs: [build-and-test]  # 只依赖构建，不依赖发布
    runs-on: ubuntu-latest
    if: always()  # 即使发布失败也创建 Release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## Watercolor UI v${{ steps.version.outputs.VERSION }}
            
            ### 安装方式
            
            #### 从 npm 安装
            ```bash
            npm install watercolor-ui@${{ steps.version.outputs.VERSION }}
            ```
            
            #### 从 GitHub Packages 安装
            ```bash
            npm install @zeturn/watercolor-ui@${{ steps.version.outputs.VERSION }}
            ```
            
            ### 更新日志
            查看 [CHANGELOG.md](https://github.com/zeturn/watercolor/blob/main/CHANGELOG.md) 了解详细更新内容。
            
            ### 文档
            - 📚 [完整文档](https://hollowdata.com)
            - 🎨 [Vue Demo](https://zeturn.github.io/watercolor/vue/)
            - ⚛️ [React Demo](https://zeturn.github.io/watercolor/react/)
          draft: false
          prerelease: false
