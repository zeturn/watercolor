name: Publish Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing SemVer tag to publish or resume (for example v2.0.0)
        required: false
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Require a SemVer tag matching every package
        env:
          RELEASE_REF_NAME: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const path = require('node:path')

          const refType = process.env.RELEASE_REF_TYPE
          const tag = process.env.RELEASE_REF_NAME || ''
          if (refType !== 'tag') {
            throw new Error('Publishing is only allowed from a tag, including manual runs.')
          }
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Release tag is not valid SemVer: ${tag}`)
          }

          const expected = tag.slice(1)
          const manifests = ['package.json']
          for (const entry of fs.readdirSync('packages', { withFileTypes: true })) {
            if (entry.isDirectory()) manifests.push(path.join('packages', entry.name, 'package.json'))
          }

          const mismatches = []
          for (const manifest of manifests) {
            if (!fs.existsSync(manifest)) continue
            const pkg = JSON.parse(fs.readFileSync(manifest, 'utf8'))
            if (pkg.version && pkg.version !== expected) {
              mismatches.push(`${pkg.name || manifest}: ${pkg.version || '<missing>'}`)
            }
          }
          if (mismatches.length) {
            throw new Error(`Tag ${tag} does not match package versions:\n${mismatches.join('\n')}`)
          }
          console.log(`Verified ${tag} against ${manifests.length} manifests.`)
          EOF

      - name: Install locked dependencies
        run: npm ci

      - name: Build libraries before checking consumers
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Lint
        run: npm run lint

      - name: Typecheck public and internal APIs
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --run

      - name: Audit design and API contracts
        run: |
          npm run audit:theme
          npm run audit:composition
          npm run audit:visual
          npm run audit:visual:minimal
          npm run audit:i18n-a11y
          npm run audit:docs-examples
          npm run audit:api
          npm run typecheck:public-api

      - name: Verify publish artifacts and clean-room consumers
        run: |
          npm run check-publish
          npm run test:package-theme

      - name: Enforce bundle size budgets
        run: npm run audit:bundle

      - name: Verify icon boundaries and consumer budgets
        run: |
          npm run audit:icons
          npm run test:installer
          npm run typecheck:icons
          npm run test:icon-builds

      - name: Build Storybooks
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          npm run build-storybook:vue
          npm run build-storybook:react

      - name: Run Storybook visual matrix
        run: npm run visual:recipes

      - name: Run Storybook accessibility matrix
        run: npm run visual:a11y

      - name: Build canonical documentation
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run docs:build

  publish:
    name: Publish verified packages
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ''
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install locked dependencies
        run: npm ci

      - name: Build packages from tagged source
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Configure npm trusted publishing
        run: |
          cat > "$RUNNER_TEMP/npmrc-oidc" <<'EOF'
          registry=https://registry.npmjs.org/
          @zeturn:registry=https://registry.npmjs.org/
          EOF

      - name: Publish in dependency order
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-oidc
          RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"

          # npm may accept a version before its asynchronous processing makes it
          # readable. Allow time for that queue and make interrupted runs resumable.
          wait_for_package() {
            local package="$1"
            local attempt
            for attempt in {1..120}; do
              if npm view "$package@$version" version --prefer-online >/dev/null 2>&1; then
                return 0
              fi
              if [ "$attempt" -eq 120 ]; then
                echo "$package@$version was not visible on npm after ten minutes" >&2
                return 1
              fi
              if [ "$((attempt % 12))" -eq 1 ]; then
                echo "Waiting for npm to process $package@$version ($attempt/120)..."
              fi
              sleep 5
            done
          }

          publish_workspace() {
            local workspace="$1"
            local package log
            package=$(node -e 'process.stdout.write(require("./" + process.argv[1] + "/package.json").name)' "$workspace")
            if npm view "$package@$version" version --prefer-online >/dev/null 2>&1; then
              echo "Already published: $package@$version; skipping."
              return 0
            fi
            log="$RUNNER_TEMP/publish-$(basename "$workspace").log"
            if npm publish --workspace "$workspace" --access public --provenance 2>&1 | tee "$log"; then
              return 0
            fi
            # A previous run may have been accepted but still be processing.
            # Only immutable-version conflicts can be recovered this way.
            if grep -Eiq 'previously published|cannot publish over|EPUBLISHCONFLICT' "$log"; then
              wait_for_package "$package"
              return
            fi
            return 1
          }

          for workspace in \
            packages/icons-feather \
            packages/icons-heroicons-react \
            packages/icons-heroicons-vue \
            packages/icons-lucide-react \
            packages/icons-lucide-vue \
            packages/icons-phosphor-react \
            packages/icons-phosphor-vue \
            packages/icons-tabler-react \
            packages/icons-tabler-vue
          do
            publish_workspace "$workspace"
          done

          publish_workspace packages/core

          for package in \
            @zeturn/watercolor-core \
            @zeturn/watercolor-icons-feather \
            @zeturn/watercolor-icons-heroicons-react \
            @zeturn/watercolor-icons-heroicons-vue \
            @zeturn/watercolor-icons-lucide-react \
            @zeturn/watercolor-icons-lucide-vue \
            @zeturn/watercolor-icons-phosphor-react \
            @zeturn/watercolor-icons-phosphor-vue \
            @zeturn/watercolor-icons-tabler-react \
            @zeturn/watercolor-icons-tabler-vue
          do
            wait_for_package "$package"
          done

          publish_workspace packages/react
          publish_workspace packages/vue
          publish_workspace packages/svelte
          publish_workspace packages/angular

          wait_for_package @zeturn/watercolor-react
          publish_workspace packages/next

          publish_workspace packages/watercolor-ui

          for workspace in packages/*; do
            manifest="$workspace/package.json"
            if [ -f "$manifest" ] && node -e 'process.exit(require("./" + process.argv[1]).private ? 1 : 0)' "$manifest"; then
              package=$(node -e 'process.stdout.write(require("./" + process.argv[1]).name)' "$manifest")
              wait_for_package "$package"
            fi
          done
