name: Publish Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require a SemVer tag matching every package
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const path = require('node:path')

          const refType = process.env.RELEASE_REF_TYPE
          const tag = process.env.RELEASE_REF_NAME || ''
          if (refType !== 'tag') {
            throw new Error('Publishing is only allowed from a tag, including manual runs.')
          }
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Release tag is not valid SemVer: ${tag}`)
          }

          const expected = tag.slice(1)
          const manifests = ['package.json']
          for (const entry of fs.readdirSync('packages', { withFileTypes: true })) {
            if (entry.isDirectory()) manifests.push(path.join('packages', entry.name, 'package.json'))
          }

          const mismatches = []
          for (const manifest of manifests) {
            if (!fs.existsSync(manifest)) continue
            const pkg = JSON.parse(fs.readFileSync(manifest, 'utf8'))
            if (pkg.version && pkg.version !== expected) {
              mismatches.push(`${pkg.name || manifest}: ${pkg.version || '<missing>'}`)
            }
          }
          if (mismatches.length) {
            throw new Error(`Tag ${tag} does not match package versions:\n${mismatches.join('\n')}`)
          }
          console.log(`Verified ${tag} against ${manifests.length} manifests.`)
          EOF

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck public and internal APIs
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --run

      - name: Audit design and API contracts
        run: |
          npm run audit:theme
          npm run audit:composition
          npm run audit:visual
          npm run audit:i18n-a11y
          npm run audit:api
          npm run typecheck:public-api

      - name: Verify publish artifacts and clean-room consumers
        run: npm run test:package

      - name: Enforce bundle size budgets
        run: npm run audit:bundle

      - name: Build Storybooks
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          npm run build-storybook:vue
          npm run build-storybook:react

      - name: Run Storybook visual matrix
        run: npm run visual:recipes

      - name: Run Storybook accessibility matrix
        run: npm run visual:a11y

      - name: Build canonical documentation
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run docs:build

  publish:
    name: Publish verified packages
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ''
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install locked dependencies
        run: npm ci

      - name: Build packages from tagged source
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Configure npm trusted publishing
        run: |
          cat > "$RUNNER_TEMP/npmrc-oidc" <<'EOF'
          registry=https://registry.npmjs.org/
          @zeturn:registry=https://registry.npmjs.org/
          EOF

      - name: Publish in dependency order
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-oidc
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"

          for workspace in \
            packages/icons-feather \
            packages/icons-heroicons-react \
            packages/icons-heroicons-vue \
            packages/icons-lucide-react \
            packages/icons-lucide-vue \
            packages/icons-phosphor-react \
            packages/icons-phosphor-vue \
            packages/icons-tabler-react \
            packages/icons-tabler-vue
          do
            npm publish --workspace "$workspace" --access public --provenance
          done

          npm publish --workspace packages/core --access public --provenance

          wait_for_package() {
            package="$1"
            for attempt in {1..12}; do
              if npm view "$package@$version" version >/dev/null 2>&1; then
                return 0
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "$package@$version was not visible on npm in time" >&2
                return 1
              fi
              sleep 5
            done
          }

          for package in \
            @zeturn/watercolor-core \
            @zeturn/watercolor-icons-feather \
            @zeturn/watercolor-icons-heroicons-react \
            @zeturn/watercolor-icons-heroicons-vue \
            @zeturn/watercolor-icons-lucide-react \
            @zeturn/watercolor-icons-lucide-vue \
            @zeturn/watercolor-icons-phosphor-react \
            @zeturn/watercolor-icons-phosphor-vue \
            @zeturn/watercolor-icons-tabler-react \
            @zeturn/watercolor-icons-tabler-vue
          do
            wait_for_package "$package"
          done

          npm publish --workspace packages/react --access public --provenance
          npm publish --workspace packages/vue --access public --provenance
          npm publish --workspace packages/watercolor-ui --access public --provenance
