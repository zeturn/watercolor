name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:


permissions:
  id-token: write
  contents: read

jobs:
  publish-core:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to support Trusted Publisher
        run: npm i -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build Core
        run: npm run build -w packages/core

      - name: Prepare npm config for OIDC
        run: |
          cat > "$RUNNER_TEMP/npmrc-oidc" <<'EOF'
          registry=https://registry.npmjs.org/
          @zeturn:registry=https://registry.npmjs.org/
          EOF

      - name: Publish Core
        run: npm publish -w packages/core --access public --provenance
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-oidc
          NODE_AUTH_TOKEN: ""

  publish-react:
    runs-on: ubuntu-latest
    needs: publish-core
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to support Trusted Publisher
        run: npm i -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build Core
        run: npm run build -w packages/core

      - name: Build React
        run: npm run build -w packages/react

      - name: Prepare npm config for OIDC
        run: |
          cat > "$RUNNER_TEMP/npmrc-oidc" <<'EOF'
          registry=https://registry.npmjs.org/
          @zeturn:registry=https://registry.npmjs.org/
          EOF

      - name: Publish React
        run: npm publish -w packages/react --access public --provenance
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-oidc
          NODE_AUTH_TOKEN: ""

  publish-vue:
    runs-on: ubuntu-latest
    needs: publish-core
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to support Trusted Publisher
        run: npm i -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build Core
        run: npm run build -w packages/core

      - name: Build Vue
        run: npm run build -w packages/vue

      - name: Prepare npm config for OIDC
        run: |
          cat > "$RUNNER_TEMP/npmrc-oidc" <<'EOF'
          registry=https://registry.npmjs.org/
          @zeturn:registry=https://registry.npmjs.org/
          EOF

      - name: Publish Vue
        run: npm publish -w packages/vue --access public --provenance
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-oidc
          NODE_AUTH_TOKEN: ""
