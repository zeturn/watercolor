name: CD - Publish to GitHub Packages and npm

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件：推送版本标签，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

# OIDC 权限配置 - npm Trusted Publisher 必需
permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-gpr:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zeturn'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure package for GitHub Packages
        run: |
          # 备份原始 package.json
          cp package.json package.json.bak
          
          # 修改 name 字段为带作用域的名称
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@zeturn/watercolor-ui';
            pkg.publishConfig = {
              registry: 'https://npm.pkg.github.com'
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # 如果版本已存在，继续执行后续步骤

      - name: Restore original package.json
        if: always()
        run: mv package.json.bak package.json

  publish-npm:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    environment: DEV
    permissions:
      id-token: write
      contents: read
    env:
      # Ensure token-based auth cannot interfere with OIDC trusted publishing.
      NODE_AUTH_TOKEN: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set npm userconfig path
        run: echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      - name: Install latest npm
        run: npm i -g npm@latest

      - name: Show npm version
        run: npm --version

      - name: Configure npm for trusted publishing (no auth)
        run: |
          set -euo pipefail
          echo "registry=https://registry.npmjs.org/" > "$NPM_CONFIG_USERCONFIG"
          echo "Using NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG"
          echo "npm registry: $(npm config get registry)"

          # Enforce npm CLI minimum required for Trusted Publishing.
          node - <<'NODE'
          const { execSync } = require('node:child_process');
          const raw = execSync('npm --version', { encoding: 'utf8' }).trim();
          const [maj, min, pat] = raw.split('.').map((x) => Number(x));
          const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
          if (!ok) {
            console.error(`npm CLI >= 11.5.1 required for trusted publishing; detected ${raw}`);
            process.exit(1);
          }
          console.log(`npm version OK: ${raw}`);
          NODE

      - name: Show GitHub OIDC env presence
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "GitHub OIDC env is present"
          else
            echo "GitHub OIDC env is MISSING"
          fi

      - name: Show GitHub OIDC token claims (safe)
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'

          function base64UrlDecode(input) {
            const pad = '='.repeat((4 - (input.length % 4)) % 4);
            const b64 = (input + pad).replace(/-/g, '+').replace(/_/g, '/');
            return Buffer.from(b64, 'base64').toString('utf8');
          }

          const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!url || !token) {
            console.log('OIDC env missing; cannot request an id-token');
            process.exit(0);
          }

          // Request an ID token with the audience npm is expected to use.
          const requestUrl = url.includes('?') ? `${url}&audience=npm` : `${url}?audience=npm`;
          const res = await fetch(requestUrl, {
            headers: {
              Authorization: `bearer ${token}`,
            },
          });
          if (!res.ok) {
            console.log(`Failed to request id-token: HTTP ${res.status}`);
            process.exit(0);
          }
          const data = await res.json();
          const value = data?.value;
          if (!value || typeof value !== 'string') {
            console.log('Unexpected id-token response shape');
            process.exit(0);
          }

          const parts = value.split('.');
          if (parts.length < 2) {
            console.log('Unexpected JWT format');
            process.exit(0);
          }
          const payload = JSON.parse(base64UrlDecode(parts[1]));

          // Print only the useful matching fields for npm Trusted Publisher config.
          const picked = {
            iss: payload.iss,
            aud: payload.aud,
            sub: payload.sub,
            repository: payload.repository,
            repository_owner: payload.repository_owner,
            workflow: payload.workflow,
            workflow_ref: payload.workflow_ref,
            job_workflow_ref: payload.job_workflow_ref,
            ref: payload.ref,
            sha: payload.sha,
            actor: payload.actor,
            environment: payload.environment,
          };

          console.log('OIDC token claims (subset):');
          console.log(JSON.stringify(picked, null, 2));
          NODE

      - name: Show npm auth diagnostics (safe)
        run: |
          set -euo pipefail
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_WORKFLOW=${GITHUB_WORKFLOW}"
          echo "GITHUB_WORKFLOW_REF=${GITHUB_WORKFLOW_REF}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"

          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG}"
          else
            echo "NPM_CONFIG_USERCONFIG is not set"
          fi

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN is set (length: ${#NODE_AUTH_TOKEN})"
          else
            echo "NODE_AUTH_TOKEN is NOT set"
          fi

          echo "npm registry: $(npm config get registry)"

          if [ -f "$HOME/.npmrc" ]; then
            echo "~/.npmrc (redacted):"
            sed -E 's/(_authToken=).+$/\1***REDACTED***/' "$HOME/.npmrc"
          else
            echo "~/.npmrc does not exist"
          fi

          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            echo "userconfig .npmrc (redacted):"
            sed -E 's/(_authToken=).+$/\1***REDACTED***/' "${NPM_CONFIG_USERCONFIG}"
          else
            echo "userconfig .npmrc does not exist"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check if version already published to npm
        id: npm_version_check
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if npm view "watercolor-ui@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "watercolor-ui@${VERSION} already exists on npm; skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "watercolor-ui@${VERSION} not found on npm; will publish"
          fi

      - name: Publish to npm (via OIDC)
        if: steps.npm_version_check.outputs.skip != 'true'
        run: npm publish --provenance --loglevel=verbose
        # OIDC Trusted Publishing 失败时应直接失败，避免“绿灯但没发出去”
        env:
          NODE_AUTH_TOKEN: ''

      - name: Collect npm debug log (sanitized)
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p npm-logs

          if [ ! -d "$HOME/.npm/_logs" ]; then
            echo "No npm log dir found"
            exit 0
          fi

          latest_log="$(ls -t "$HOME/.npm/_logs"/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest_log" ]; then
            echo "No npm debug log found"
            ls -la "$HOME/.npm/_logs" || true
            exit 0
          fi

          echo "Found npm debug log: $latest_log"

          # Redact bearer tokens and JWT-like strings.
          sed -E \
            -e 's/(Bearer )[A-Za-z0-9._-]+/\1***REDACTED***/g' \
            -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/***JWT_REDACTED***/g' \
            "$latest_log" > "npm-logs/$(basename "$latest_log")"

      - name: Upload npm debug log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-log
          path: npm-logs/
          retention-days: 7

  create-release:
    needs: [build-and-test]  # 只依赖构建，不依赖发布
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')  # 仅对版本标签创建/更新 Release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## Watercolor UI v${{ steps.version.outputs.VERSION }}

            ### 安装方式

            #### 从 npm 安装
            ```bash
            npm install watercolor-ui@${{ steps.version.outputs.VERSION }}
            ```

            #### 从 GitHub Packages 安装
            ```bash
            npm install @zeturn/watercolor-ui@${{ steps.version.outputs.VERSION }}
            ```

            ### 更新日志
            查看 [CHANGELOG.md](https://github.com/zeturn/watercolor/blob/main/CHANGELOG.md) 了解详细更新内容。

            ### 文档
            - 📚 [完整文档](https://hollowdata.com)
            - 🎨 [Vue Demo](https://zeturn.github.io/watercolor/vue/)
            - ⚛️ [React Demo](https://zeturn.github.io/watercolor/react/)
          draft: false
          prerelease: false
