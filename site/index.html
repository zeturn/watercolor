<!DOCTYPE html>
<html lang="zh-CN" data-theme="watercolor">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ec4899" />
    <meta name="color-scheme" content="light dark" />
    <title>Watercolor UI - 水彩风格的跨框架组件库</title>
    <meta name="description" content="Watercolor UI 是一个现代、极简、水彩风格的跨框架 UI 组件库，同时支持 Vue 3 和 React，提供 60+ 开箱即用组件，零运行时依赖、可主题化、可访问。" />

    <!-- 默认社交分享 / Open Graph（运行时按路由由 src/seo.js 覆盖） -->
    <link rel="canonical" href="https://watercolorui.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Watercolor UI" />
    <meta property="og:title" content="Watercolor UI - 水彩风格的跨框架组件库" />
    <meta property="og:description" content="Watercolor UI 是一个现代、极简、水彩风格的跨框架 UI 组件库，同时支持 Vue 3 和 React。" />
    <meta property="og:url" content="https://watercolorui.com/" />
    <meta property="og:image" content="https://watercolorui.com/og-image.svg" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Watercolor UI - 水彩风格的跨框架组件库" />
    <meta name="twitter:description" content="Watercolor UI 是一个现代、极简、水彩风格的跨框架 UI 组件库，同时支持 Vue 3 和 React。" />
    <meta name="twitter:image" content="https://watercolorui.com/og-image.svg" />

    <!-- 结构化数据：站点 + 软件应用 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Watercolor UI",
      "url": "https://watercolorui.com",
      "description": "Watercolor UI 是一个现代、极简、水彩风格的跨框架 UI 组件库，同时支持 Vue 3 和 React。",
      "inLanguage": "zh-CN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://watercolorui.com/components?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Watercolor UI",
      "url": "https://watercolorui.com",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "description": "跨框架水彩风格 UI 组件库，支持 React 与 Vue 3，零运行时依赖。",
      "sameAs": ["https://github.com/zeturn/watercolor"]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
